<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="stars"></canvas>


    <!-- =========================
         INTRO SCREEN
    ========================== -->

    <section class="screen active" id="intro">

        <div class="content">

            <div class="mini-heart">
                ♥
            </div>

            <h1>
                Something special<br>
                for you ❤️
            </h1>

            <p>
                Tap below and watch till the end.
            </p>

            <button id="openBtn">
                Open ❤️
            </button>

        </div>

    </section>



    <!-- =========================
         PHOTO HEART
    ========================== -->

    <section class="screen" id="gallery">

        <div class="content">

            <div id="heart">

                <div class="heart-glow"></div>

                <div class="heart-core">
                    ♥
                </div>


                <!-- PHOTO 1 -->

                <div class="card">
                    <img
                        src="assets/10e5e48a-be61-443f-8080-e23087b74fc6.jpeg"
                        alt="Photo 1">
                </div>


                <!-- PHOTO 2 -->

                <div class="card">
                    <img
                        src="assets/11ff4352-4532-48e4-b308-6cd5458b5071.jpeg"
                        alt="Photo 2">
                </div>


                <!-- PHOTO 3 -->

                <div class="card">
                    <img
                        src="assets/2f362add-e42a-4181-abf7-c3b9fb2e2336.jpeg"
                        alt="Photo 3">
                </div>


                <!-- PHOTO 4 -->

                <div class="card">
                    <img
                        src="assets/60addc14-f137-4dcf-9e05-04d35bd025a6.jpeg"
                        alt="Photo 4">
                </div>


                <!-- PHOTO 5 -->

                <div class="card">
                    <img
                        src="assets/78e23137-6b91-4e3f-bb53-cf45613b9e3f.jpeg"
                        alt="Photo 5">
                </div>


                <!-- PHOTO 6 -->

                <div class="card">
                    <img
                        src="assets/89828bca-abc3-41f9-916b-cdf94354aee6.jpeg"
                        alt="Photo 6">
                </div>


                <!-- PHOTO 7 -->

                <div class="card">
                    <img
                        src="assets/a68a15ab-6ed5-45da-a233-5079069d58b1.jpeg"
                        alt="Photo 7">
                </div>


                <!-- PHOTO 8 -->

                <div class="card">
                    <img
                        src="assets/d125591d-3300-4de6-8d59-df75bc46e2ba.jpeg"
                        alt="Photo 8">
                </div>


                <!-- PHOTO 9 -->

                <div class="card">
                    <img
                        src="assets/d669ed32-7a78-40d5-81f1-0fc411286ce7.jpeg"
                        alt="Photo 9">
                </div>


                <!-- PHOTO 10 -->

                <div class="card">
                    <img
                        src="assets/eb0ed474-3441-4a23-bded-3506b1dae6f1.jpeg"
                        alt="Photo 10">
                </div>

            </div>


            <p class="gallery-caption">
                Every picture has a little piece of you ❤️
            </p>


            <button id="nextBtn">
                One more thing ❤️
            </button>

        </div>

    </section>



    <!-- =========================
         FINAL PHOTO
    ========================== -->

    <section class="screen" id="final">

        <div class="content final-content">

            <div class="final-frame">

                <img
                    src="assets/1768930382681.jpeg"
                    alt="Final Photo">

            </div>


            <h1 class="final-title">
                Always ❤️
            </h1>


            <p>
                You make ordinary moments feel special.
            </p>


            <div class="final-hearts">
                ♥ ♥ ♥
            </div>

        </div>

    </section>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
